spring.application.name=qvorum-server

# Loads server/.env so the values below can use its variables. The second path covers running
# from the repository root (e.g. when the whole repo is opened in the IDE).
spring.config.import=optional:file:.env[.properties],optional:file:server/.env[.properties]

# HTTP server: 0.0.0.0 accepts connections from other devices on the network.
server.address=${SERVER_HOST:0.0.0.0}
server.port=${SERVER_PORT:8080}

# Database. The defaults match docker-compose.yml.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/qvorum}
spring.datasource.username=${DB_USER:qvorum}
spring.datasource.password=${DB_PASSWORD:qvorum}

# The schema is created by Flyway (src/main/resources/db/migration); Hibernate only checks
# that the entities match it and never changes tables itself.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# JWT: the secret must be at least 32 characters. Override JWT_SECRET outside development.
jwt.secret=${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
jwt.validity-hours=12

# Email. The defaults point to Mailpit from docker-compose.yml, which catches every email and
# shows it at http://localhost:8025 instead of delivering it.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
qvorum.mail.from=${MAIL_FROM:Qvorum <no-reply@qvorum.test>}

# Uploaded photos (meter readings, issue reports). The folder is created when needed.
qvorum.upload-dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
